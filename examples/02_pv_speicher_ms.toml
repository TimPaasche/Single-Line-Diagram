# Beispiel 2 als TOML (inhaltsgleich mit 02_pv_speicher_ms.yaml)

[diagram]
title = "PV 500 kWp + Speicher am MS-Netz"
project = "Beispiel 2 – Gewerbe"
theme = "din"

[[nodes]]
id = "netz"
type = "grid"
voltage_kv = 20
sk_mva = 250
label = "EVU Mittelspannung"

[[nodes]]
id = "ms_bus"
type = "busbar"
voltage_kv = 20
label = "Übergabestation"

[[nodes]]
id = "t1"
type = "transformer"
rating_kva = 1250
ratio = "20/0.4 kV"
uk_percent = 6
vector_group = "Dyn5"

[[nodes]]
id = "nsp_bus"
type = "busbar"
voltage_kv = 0.4
label = "NSHV"

[[nodes]]
id = "wr1"
type = "inverter"
kva = 500
inverter_type = "central"

[[nodes]]
id = "pv1"
type = "pv_array"
kwp = 500
strings = 40

[[nodes]]
id = "bat1"
type = "battery"
kwh = 1000
kw = 500
coupling = "ac"
inverter_kva = 500

[[nodes]]
id = "ev"
type = "load"
kw = 80
label = "Eigenbedarf"

[[connections]]
from = "netz"
to = "ms_bus"
via = [
  { type = "circuit_breaker", id = "Q1", state = "closed" },
  { type = "meter", id = "P1", direction = "bidirectional" },
]

[[connections]]
from = "ms_bus"
to = "t1"
via = [
  { type = "circuit_breaker", id = "Q2" },
  { type = "cable", designation = "NA2XS2Y", conductors = "3×1×", cross_section_mm2 = 150, length_m = 350 },
]

[[connections]]
from = "t1"
to = "nsp_bus"
via = [{ type = "circuit_breaker", id = "Q3", rating_a = 2000 }]

[[connections]]
from = "nsp_bus"
to = "wr1"
via = [{ type = "fuse", rating_a = 800 }]

[[connections]]
from = "wr1"
to = "pv1"

[[connections]]
from = "nsp_bus"
to = "bat1"
via = [{ type = "circuit_breaker", rating_a = 800 }]

[[connections]]
from = "nsp_bus"
to = "ev"
via = [{ type = "fuse", rating_a = 160 }]
