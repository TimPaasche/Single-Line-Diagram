[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sld"
version = "0.1.0"
description = "Konfigurierbarer Einlinienschaltplan-Generator (PV, Speicher, Transformatoren)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tim Paasche" }]
keywords = ["single-line diagram", "einlinienschaltplan", "photovoltaics", "battery storage", "transformer", "DIN EN 60617"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/TimPaasche/Single-Line-Diagram"

[project.scripts]
sld = "sld.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
